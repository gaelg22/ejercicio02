<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary bg-opacity-75">

<div class="container mt-5 bg-dark text-white p-4 rounded">

    <h3 class="mb-3">Listado de Pacientes</h3>

    <div class="mb-3">
        <a th:href="@{/pacientes/agregar}" class="btn btn-success btn-sm">Agregar paciente</a>
        <a th:href="@{/}" class="btn btn-light btn-sm ms-2">Inicio</a>
    </div>

    <table class="table table-dark table-striped">
        <thead>
        <tr>
            <th>Id</th>
            <th>Nombre</th>
            <th>Diagnóstico</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>1</td>
            <td>María López</td>
            <td>Diabetes tipo 2</td>
            <td>
                <a th:href="@{/pacientes/editar/1}" class="btn btn-primary btn-sm">Editar</a>
                <a th:href="@{/pacientes/eliminar/1}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
